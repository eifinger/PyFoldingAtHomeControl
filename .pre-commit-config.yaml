---
repos:
  - repo: local
    hooks:
      - id: black
        name: ☕️ Format using black
        language: system
        types: [python]
        entry: uvx black .
        require_serial: true
      - id: blacken-docs
        name: ☕️ Format documentation examples using black
        language: system
        files: '\.(rst|md|markdown|py|tex)$'
        entry: uvx blacken-docs
        require_serial: true
      - id: check-ast
        name: 🐍 Check Python AST
        language: system
        types: [python]
        entry: uv run check-ast
      - id: check-case-conflict
        name: 🔠 Check for case conflicts
        language: system
        entry: uv run check-case-conflict
      - id: check-docstring-first
        name: ℹ️  Check docstring is first
        language: system
        types: [python]
        entry: uv run check-docstring-first
      - id: check-executables-have-shebangs
        name: 🧐 Check that executables have shebangs
        language: system
        types: [text, executable]
        entry: uv run check-executables-have-shebangs
        stages: [pre-commit, pre-push, manual]
      - id: check-json
        name: ｛ Check JSON files
        language: system
        types: [json]
        entry: uv run check-json
      - id: check-merge-conflict
        name: 💥 Check for merge conflicts
        language: system
        types: [text]
        entry: uv run check-merge-conflict
      - id: check-symlinks
        name: 🔗 Check for broken symlinks
        language: system
        types: [symlink]
        entry: uv run check-symlinks
      - id: check-toml
        name: ✅ Check TOML files
        language: system
        types: [toml]
        entry: uv run check-toml
      - id: check-xml
        name: ✅ Check XML files
        entry: uv run check-xml
        language: system
        types: [xml]
      - id: check-yaml
        name: ✅ Check YAML files
        language: system
        types: [yaml]
        entry: uv run check-yaml
      - id: codespell
        name: ✅ Check code for common misspellings
        language: system
        types: [text]
        exclude: ^uv\.lock$
        entry: uv run codespell --ignore-words=.codespell
      - id: debug-statements
        name: 🪵  Debug Statements and imports (Python)
        language: system
        types: [python]
        entry: uv run debug-statement-hook
      - id: detect-private-key
        name: 🕵️  Detect Private Keys
        language: system
        types: [text]
        entry: uv run detect-private-key
      - id: end-of-file-fixer
        name: ⮐  Fix End of Files
        language: system
        types: [text]
        entry: uv run end-of-file-fixer
        stages: [pre-commit, pre-push, manual]
      - id: fix-byte-order-marker
        name: 🚏 Fix UTF-8 byte order marker
        language: system
        types: [text]
        entry: uv run fix-byte-order-marker
      - id: mypy
        name: 🆎 Static type checking using mypy
        language: system
        types: [python]
        exclude: ^tests/
        entry: uvx mypy
        require_serial: true
      - id: no-commit-to-branch
        name: 🛑 Don't commit to main branch
        language: system
        entry: uv run no-commit-to-branch
        pass_filenames: false
        always_run: true
        args:
          - --branch=main
      - id: pytest
        name: 🧪 Running tests and test coverage with pytest
        language: system
        types: [python]
        entry: uv run pytest
        pass_filenames: false
      - id: trailing-whitespace
        name: ✄  Trim Trailing Whitespace
        language: system
        types: [text]
        entry: uv run trailing-whitespace-fixer
        stages: [pre-commit, pre-push, manual]
      - id: vulture
        name: 🔍 Find unused Python code with Vulture
        language: system
        types: [python]
        entry: uv run vulture
        pass_filenames: false
        require_serial: true
      - id: yamllint
        name: 🎗  Check YAML files with yamllint
        language: system
        types: [yaml]
        entry: uv run yamllint
      - id: pyright
        name: 🆎 Static type checking using pyright
        entry: uv run pyright
        language: node
        types: [python]
        exclude: ^tests/
        pass_filenames: false
        additional_dependencies: ["pyright@1.1.406"]
      - id: ruff
        name: ⚡️ Check with ruff
        language: system
        entry: uvx ruff check
        types: [python]
        args: ["--force-exclude"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.0.0-alpha.4"
    hooks:
      - id: prettier
        name: 💄 Ensuring files are prettier
        types: [yaml, json, markdown]
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: "v0.9.0"
    hooks:
      - id: shellcheck
        name: ✅ Check Shell files
