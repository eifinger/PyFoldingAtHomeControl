---
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        stages: [commit, push, manual]
      - id: end-of-file-fixer
        stages: [commit, push, manual]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-case-conflict
      - id: check-executables-have-shebangs
        stages: [commit, push, manual]
      - id: fix-byte-order-marker
      - id: detect-private-key
      - id: no-commit-to-branch
        pass_filenames: false
        always_run: true
        args:
          - --branch=main
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: debug-statements
  - repo: local
    hooks:
      - id: black
        name: ☕️ Format using black
        language: system
        types: [python]
        entry: uv run black
        require_serial: true
      - id: blacken-docs
        name: ☕️ Format documentation examples using black
        language: system
        files: '\.(rst|md|markdown|py|tex)$'
        entry: uv run blacken-docs
        require_serial: true
      - id: codespell
        name: ✅ Check code for common misspellings
        language: system
        types: [text]
        exclude: ^uv\.lock$
        entry: uv run codespell --ignore-words=.codespell
      - id: mypy
        name: 🆎 Static type checking using mypy
        language: system
        types: [python]
        exclude: ^tests/
        entry: uv run mypy
        require_serial: true
      - id: pytest
        name: 🧪 Running tests and test coverage with pytest
        language: system
        types: [python]
        entry: uv run pytest
        pass_filenames: false
      - id: vulture
        name: 🔍 Find unused Python code with Vulture
        language: system
        types: [python]
        entry: uv run vulture
        pass_filenames: false
        require_serial: true
      - id: yamllint
        name: 🎗  Check YAML files with yamllint
        language: system
        types: [yaml]
        entry: uv run yamllint
      - id: ruff
        name: ⚡️ Check with ruff
        language: system
        entry: uv run ruff check
        types: [python]
        args: ["--force-exclude"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.0.0-alpha.4"
    hooks:
      - id: prettier
        name: 💄 Ensuring files are prettier
        types: [yaml, json, markdown]
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: "v0.9.0"
    hooks:
      - id: shellcheck
        name: ✅ Check Shell files
