[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[project]
name = "PyFoldingAtHomeControl"
version = "4.0.0"
description = "Python library to get stats from your Folding@Home Clients"
license = "MIT"
authors = [
  {name = "Kevin Stillhammer", email = "kevin.stillhammer@gmail.com"}
]
readme = "README.md"
urls = { "PyFoldingAtHomeControl" = "http://github.com/eifinger/PyFoldingAtHomeControl" }
keywords = [
    "Folding@Home",
    "asyncio"
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python=">=3.13.7"
dependencies = [
    "cryptography>=46.0.3",
    "httpx>=0.28.1",
    "httpx-ws>=0.8.0",
]


[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --cov-report xml --cov=FoldingAtHomeControl tests"

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
lint.ignore = ['E501']
line-length = 88
lint.select = [
    'B',
    'B9',
    'C',
    'E',
    'F',
    'W',
]
fix = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.vulture]
min_confidence = 80
paths = ["FoldingAtHomeControl", "tests"]

[tool.uv.build-backend]
module-name = "FoldingAtHomeControl"
module-root = ""

[dependency-groups]
dev = [
    "black>=25.9.0",
    "blacken-docs>=1.20.0",
    "codecov>=2.1.13",
    "codespell>=2.4.1",
    "coverage>=7.11.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.1",
    "vulture>=2.14",
    "yamllint>=1.37.1",
]
